# Runs the Appium + WebdriverIO suite on an Android emulator for every push and PR to main.
# Quality gate: if any test fails, this job fails, and (with branch protection on) the PR
# can't be merged.
name: Android E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# If a new commit lands on the same branch, cancel the older run instead of queueing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    name: Appium tests (Android 14 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Java is needed by the Android tools and by the Allure report generator.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Lets the emulator use hardware virtualization (KVM) on the Linux runner.
      # Without this, the emulator falls back to software emulation and is far too slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download ApiDemos APK
        run: |
          mkdir -p apps
          curl -fL -o apps/ApiDemos-debug.apk \
            https://github.com/appium/android-apidemos/releases/download/v6.0.18/ApiDemos-debug.apk

      # Creates and boots the emulator, runs `script` once it's ready, then shuts it down.
      # Same Android version and image type as the local AVD (API 34, google_apis), but
      # x86_64 instead of arm64 because the CI machine has an Intel/AMD CPU.
      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: |
            adb install -r apps/ApiDemos-debug.apk
            npm test

      # Everything below runs even when tests fail (`if: always()`), because a failed run
      # is exactly when you need the evidence.
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report (with videos and screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Upload failure screenshots and Appium logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: |
            screenshots/
            logs/
          retention-days: 14
